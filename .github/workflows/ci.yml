name: CI

# Tests every part of the repo: the Rust bridge daemon, the Svelte web UI, the
# Home Assistant integration, and the docker-based add-on end-to-end suite.
# (The add-on image *build+push* is a separate workflow, build-addon.yml.)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One in-flight run per ref; a new push cancels the previous run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fmt:
    name: Rust formatting (rustfmt)
    runs-on: ubuntu-latest
    steps:
      # `submodules` because bridge-daemon's Cargo.toml has a path dependency on
      # submodules/sendspin — without it every cargo command (even `cargo fmt`,
      # which shells out to `cargo metadata`) dies on "failed to load manifest".
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      # Config in bridge-daemon/rustfmt.toml (max_width 140). No compile needed,
      # so this job is fast and has no system deps. Run `cargo fmt` locally to fix.
      - name: Check formatting
        working-directory: pipewire_audio_router/bridge-daemon
        run: cargo fmt --check

  rust:
    name: Rust bridge-daemon (clippy + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipewire_audio_router/bridge-daemon
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      # Same build deps as the Dockerfile's build stage — keep this list and the
      # Dockerfile's native branch in step, or a dependency only one of them has
      # makes CI and the image disagree about whether the tree builds.
      #   libasound2-dev  the embedded sendspin server's transitive cpal/alsa
      #                   dependency (no feature flag drops its audio-output
      #                   module, even though we only use the server-role path)
      #   libevent-dev    vendor/libairptp includes <event2/event.h> (build.rs)
      #   cmake make g++  cc-rs/cmake crates: bundled libopus, and fdk-aac-sys
      #                   compiles C++ (needs cc1plus)
      # The runner image happens to ship cmake/make/g++ already; they are listed
      # anyway so this reads as the whole requirement rather than the remainder.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config clang cmake make g++ libpipewire-0.3-dev libspa-0.2-dev libasound2-dev libevent-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # Depends on the public `sendspin` submodule (davidgraeff/sendspin-rs) —
      # cloned anonymously over https; no token needed while that repo is public.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: pipewire_audio_router/bridge-daemon
      # `-A derivable_impls`: RaopEncryption keeps a hand-written `Default`
      # (defaults to the 3rd variant, and reads clearer than a `#[default]`
      # attr). Drop the `-D warnings` escalation if it's too strict mid-refactor.
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings -A clippy::derivable_impls
      - name: Tests
        run: cargo test --all-targets

  frontend:
    name: Web UI (svelte-check + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipewire_audio_router/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: pipewire_audio_router/frontend/package-lock.json
      - run: npm ci
      - name: Type-check
        run: npm run check
      - name: Build
        run: npm run build
      - name: Build dashboard card
        run: npm run build:card
      # The card is a *committed* artifact (HACS copies the integration verbatim
      # and runs no build step), so a change to src/card/ that wasn't rebuilt
      # would ship the old card. This is the only thing that catches that.
      - name: Committed card is up to date
        working-directory: .
        run: |
          if ! git diff --exit-code -- custom_components/pipewire_audio_router/www/; then
            echo "::error::the built card differs from the committed one — run 'npm run build:card' in pipewire_audio_router/frontend and commit the result"
            exit 1
          fi

  integration:
    name: HA integration (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      # The Home Assistant under test is pinned in
      # custom_components/pipewire_audio_router/tests/requirements.txt — the same
      # file scripts/test-custom-components.sh builds its image from, so local
      # and CI runs agree. That pin needs Python >=3.14 (setup-python above), and
      # bumping it is documented in docs/addon_maintenance.md. (hacs.json declares
      # a 2024.1.0 floor, but that predates Python 3.14, so it isn't testable here.)
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r custom_components/pipewire_audio_router/tests/requirements.txt
          # The integration depends on the `frontend` component (it serves the
          # dashboard card), and that component imports `hass_frontend` when it
          # sets up — without this wheel every test that loads a config entry
          # fails with "Setup failed for dependencies: ['frontend']". Version
          # taken from the installed component's own manifest, so it always
          # matches the HA the pin above resolved to.
          pip install "$(python -c "import json, pathlib, homeassistant.components.frontend as f; print(json.loads((pathlib.Path(f.__file__).parent / 'manifest.json').read_text())['requirements'][0])")"
      - name: Pytest
        run: pytest custom_components/pipewire_audio_router/tests/ -q

  e2e:
    name: Add-on end-to-end (docker)
    runs-on: ubuntu-latest
    # Only worth the ~image-build cost once the unit builds pass — the docker
    # build compiles the same Rust + frontend anyway.
    needs: [rust, frontend]
    timeout-minutes: 30
    steps:
      # The image build needs submodules/sendspin in the context (the Dockerfile
      # asserts it is non-empty before compiling).
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Ensure ffmpeg (fixture generation + signal analysis)
        run: ffmpeg -version >/dev/null 2>&1 || { sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg; }
      - name: Generate the audio fixture
        # Replaces /usr/share/sounds/speech-dispatcher/pipe.wav (not present on
        # CI runners) — the announce tests loop this as the "music" bed.
        run: ffmpeg -y -loglevel error -f lavfi -i "sine=frequency=440:duration=2" -ar 44100 -ac 2 "$RUNNER_TEMP/music.wav"
      - name: Build the add-on image
        run: docker build -t pipewire_audio_router:dev pipewire_audio_router
      - name: Run the CI-feasible e2e suite
        env:
          IMAGE: pipewire_audio_router:dev
          MUSIC_WAV_HOST_PATH: ${{ runner.temp }}/music.wav
          WAV_HOST_PATH: ${{ runner.temp }}/music.wav
        # The whole add-on suite runs. phase2 / phase3 self-skip here: they need
        # Music Assistant's proprietary `cliraop` (a real AirPlay sender) that
        # isn't in this repo — run them locally with CLIRAOP_PATH set. The rest
        # are self-contained (virtual PipeWire nodes, a local HTTP clip source, …).
        run: |
          fail=0
          for t in phase1_e2e phase2_e2e phase3_multi_output hot_reload_e2e routing_ui_e2e; do
            echo "::group::test_addon_${t}.sh"
            bash "tests/test_addon_${t}.sh" || { echo "FAILED: $t"; fail=1; }
            echo "::endgroup::"
          done
          exit $fail
