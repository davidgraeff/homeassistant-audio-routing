name: Build add-on image

# Prebuilds the add-on's multi-arch images and pushes them to GHCR, so a
# community install pulls a ready image instead of compiling the Rust
# bridge daemon on-device (slow on a Pi 4). Local `/addons/` dev installs
# (scripts/deploy-dev.sh) are unaffected — those always build from the
# Dockerfile on-device by design, for fast iteration on uncommitted code.
#
# Our Dockerfile's base images (rust:1-slim-trixie, ubuntu:26.04) are
# already multi-arch manifests, so a plain buildx cross-build under QEMU
# is enough — no HA-specific build tooling/BUILD_FROM plumbing needed.

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "pipewire_audio_router/**"
      - ".github/workflows/build-addon.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: aarch64
            platform: linux/arm64
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read add-on version from config.yaml
        id: version
        run: |
          v=$(grep '^version:' pipewire_audio_router/config.yaml | sed -E 's/version: *"?([^"]+)"?/\1/')
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: pipewire_audio_router
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.arch }}-addon-pipewire_audio_router:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/${{ matrix.arch }}-addon-pipewire_audio_router:latest
