name: Build add-on images

# Prebuilds this repo's add-on images and pushes them to GHCR, so a community
# install pulls a ready image instead of building on-device. Local `/addons/` dev
# installs (scripts/deploy-dev.sh) are unaffected — those always build from the
# Dockerfile on the workstation by design, for fast iteration on uncommitted code.
#
# Both add-ons set `image:` in their config.yaml, which is what makes Supervisor
# treat them as image-based (build: false) and *pull*. That is only a promise the
# registry can keep if this workflow has run: without a published image, installing
# fails at the pull. The two are here for different reasons —
#
#   pipewire_audio_router  compiling the Rust bridge daemon on a Pi 4 is slow. The
#     Dockerfile pins its build stages `FROM --platform=$BUILDPLATFORM`, so rustc runs
#     natively on the amd64 runner and CROSS-compiles to the target arch; the heavy
#     codegen is never emulated (measured ~20x faster: 50 s vs 17 m). QEMU is still set
#     up because the runtime stage is built for the target arch and its apt-install
#     runs emulated — cheap, no compilation.
#   ytmusic_receiver       no compiler at all, but assembling it still means apt + npm
#     install + a pip venv, and doing *that* under emulation on a Pi 4 is the slow part.
#
# GHCR visibility: a newly created package is private, and Supervisor then fails the
# pull with `401 unauthorized`. Both Dockerfiles carry
# `LABEL org.opencontainers.image.source`, which links the package to this repository
# so it inherits the repo's visibility — but a package that was created private before
# the label existed stays private until it is flipped by hand in its GHCR settings.

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "pipewire_audio_router/**"
      - "ytmusic_receiver/**"
      - "firmware/pi-ytmusic/receiver/**"
      - "scripts/stage-ytmusic-receiver.sh"
      - ".github/workflows/build-addon.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      # Every (add-on, arch) pair independently, so one slow build never delays
      # another and a failure names exactly what broke. `slug` × `arch` are the real
      # dimensions; `include` only attaches the buildx platform to each arch — it must
      # match on a value of an existing key to do that, otherwise its pairs would be
      # merged into every combination instead of selecting one.
      #
      # `fail-fast: false` is what makes "names exactly what broke" true: the default
      # cancels the surviving pairs, so a single bad (add-on, arch) — e.g. one whose
      # GHCR package the token cannot write — reports as four broken builds and hides
      # whether the other three would have published. Same reasoning as
      # prune-packages.yml.
      fail-fast: false
      matrix:
        slug: [pipewire_audio_router, ytmusic_receiver]
        arch: [amd64, aarch64]
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: aarch64
            platform: linux/arm64
    steps:
      # `submodules` because the router's Dockerfile builds submodules/sendspin as a
      # path dependency and asserts the directory is non-empty before compiling.
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The YouTube Music add-on's application code is canonical under
      # firmware/pi-ytmusic/ (the Pi role must stay `scp`-installable), and Docker
      # cannot COPY from outside its context. Same script deploy-dev.sh uses.
      - name: Stage the shared cast-receiver app
        if: matrix.slug == 'ytmusic_receiver'
        run: ./scripts/stage-ytmusic-receiver.sh

      - name: Read add-on version from config.yaml
        id: version
        run: |
          v=$(grep '^version:' ${{ matrix.slug }}/config.yaml | sed -E 's/version: *"?([^"]+)"?/\1/')
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.slug }}
          platforms: ${{ matrix.platform }}
          push: true
          # Baked into the image so the add-on can report its own version.
          build-args: |
            ADDON_VERSION=${{ steps.version.outputs.version }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.arch }}-addon-${{ matrix.slug }}:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/${{ matrix.arch }}-addon-${{ matrix.slug }}:latest
          # Reuse unchanged layers (apt, cargo deps, npm) across runs. Shares the
          # per-arch :buildcache tag with scripts/deploy-dev.sh, so dev and CI warm
          # each other's cache.
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/${{ matrix.arch }}-addon-${{ matrix.slug }}:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/${{ matrix.arch }}-addon-${{ matrix.slug }}:buildcache,mode=max
