name: Build add-on image

# Prebuilds the add-on's multi-arch images and pushes them to GHCR, so a
# community install pulls a ready image instead of compiling the Rust
# bridge daemon on-device (slow on a Pi 4). Local `/addons/` dev installs
# (scripts/deploy-dev.sh) are unaffected — those always build from the
# Dockerfile on-device by design, for fast iteration on uncommitted code.
#
# The Dockerfile pins its build stages `FROM --platform=$BUILDPLATFORM`, so
# rustc runs natively on the amd64 runner and CROSS-compiles to the target
# arch — the heavy Rust codegen is never emulated (measured ~20x faster than
# emulating it: 50s vs 17m for this daemon). QEMU is still set up below because
# the runtime stage (ubuntu:26.04) is built for the target arch and its
# apt-install runs emulated — but that's cheap (no compilation). No HA-specific
# BUILD_FROM plumbing needed; the base images are plain multi-arch manifests.

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "pipewire_audio_router/**"
      - ".github/workflows/build-addon.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: aarch64
            platform: linux/arm64
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read add-on version from config.yaml
        id: version
        run: |
          v=$(grep '^version:' pipewire_audio_router/config.yaml | sed -E 's/version: *"?([^"]+)"?/\1/')
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: pipewire_audio_router
          platforms: ${{ matrix.platform }}
          push: true
          # Baked into the image so the daemon can log the add-on version.
          build-args: |
            ADDON_VERSION=${{ steps.version.outputs.version }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.arch }}-addon-pipewire_audio_router:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/${{ matrix.arch }}-addon-pipewire_audio_router:latest
          # Reuse unchanged layers (apt, cargo deps) across runs. Shares the
          # per-arch :buildcache tag with scripts/deploy-dev.sh, so dev and CI
          # warm each other's cache.
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/${{ matrix.arch }}-addon-pipewire_audio_router:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/${{ matrix.arch }}-addon-pipewire_audio_router:buildcache,mode=max
