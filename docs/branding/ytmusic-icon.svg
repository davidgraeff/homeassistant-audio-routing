<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>YouTube Music Cast Receiver</title>
  <!--
    Sibling of icon.svg, and deliberately so: same surface, same fan-out to three
    rooms, with the source glyph swapped from a speaker to a play triangle. In the
    add-on store the two sit next to each other, and the shared shape is the message
    — this is a thing that plays *into* the router.

    No YouTube red and no play-button-in-a-rounded-rect: this add-on is not from
    Google, and its icon should not suggest otherwise.
  -->
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#143753"/>
      <stop offset="1" stop-color="#091d2f"/>
    </linearGradient>
    <linearGradient id="source" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb23a"/>
      <stop offset="1" stop-color="#ff8f00"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#surface)"/>
  <rect x="2" y="2" width="508" height="508" rx="110" fill="none"
        stroke="#ffffff" stroke-opacity="0.07" stroke-width="4"/>

  <g transform="translate(-12,0)">
    <!-- source: a play triangle. Stroked in its own fill with a round join, which
         is what rounds the corners without hand-fitting three arcs. -->
    <path d="M104 162 L228 256 L104 350 Z" fill="url(#source)" stroke="url(#source)"
          stroke-width="26" stroke-linejoin="round"/>
    <!-- signal paths -->
    <g fill="none" stroke="#ffffff" stroke-width="21" stroke-linecap="round">
      <path d="M256 256 C 296 256 308 126 368 126"/>
      <path d="M256 256 H 368"/>
      <path d="M256 256 C 296 256 308 386 368 386"/>
    </g>
    <!-- outputs -->
    <g fill="#ffffff">
      <circle cx="414" cy="126" r="30"/>
      <circle cx="414" cy="256" r="30"/>
      <circle cx="414" cy="386" r="30"/>
    </g>
  </g>
</svg>
