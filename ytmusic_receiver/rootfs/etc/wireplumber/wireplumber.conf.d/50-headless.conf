# Headless network-audio add-on: no cameras, no snap sandbox.
#
# WirePlumber's default profile enables monitors/integrations for hardware this
# container never has, and each one logs a warning at startup when the backing
# host bits are missing. Disabling the corresponding profile features removes
# the warnings at the source (rather than just lowering the log level):
#
#   s-monitors-libcamera  PipeWire's libcamera SPA plugin is missing or broken.
#   wp-device             SPA handle 'api.libcamera.enum.manager' could not be loaded
#     -> hardware.video-capture is the virtual feature that pulls in BOTH the
#        v4l2 and libcamera monitors (see the `wants = [ monitor.v4l2,
#        monitor.libcamera ]` entry in the default wireplumber.conf), so the one
#        switch below covers both. This add-on only routes network audio.
#
#   m-snapd-permission    Failed to connect to snapd: No such file or directory
#     -> script.client.access-snap is WirePlumber's snap audio-permission
#        integration; there is no snapd in this container, and nothing we run is
#        a snap-confined client.
#
#   s-monitors bluez.lua        PipeWire's BlueZ SPA plugin is missing or broken.
#   s-monitors bluez-midi.lua   PipeWire's BlueZ MIDI SPA missing or broken.
#   wp-node    spa-node-factory  failed to create node (BLE MIDI server)
#     -> hardware.bluetooth is the virtual feature that pulls in both the
#        bluez audio and bluez-midi monitors (`wants = [ monitor.bluez,
#        monitor.bluez-midi ]` in the default wireplumber.conf). We ship no
#        bluez5 SPA plugin and route only network audio, so disable it.
#
#   wp-internal-comp-loader  support.logind ... failed to start systemd logind
#                            monitor: -2 (No such file or directory)
#   wp-internal-comp-loader  skipping component 'monitor.bluez.seat-monitoring'
#     -> support.logind (libwireplumber-module-logind) needs systemd-logind,
#        which isn't running in this container; monitor.bluez.seat-monitoring
#        depends on it. WirePlumber's own systemwide/embedded profile mixin
#        disables exactly this pair — we do the same. Harmless once bluetooth
#        is off anyway, but disabling them explicitly removes the notices.
#
#   wp-internal-comp-loader  optional component 'support.system-dbus [module:
#                            libwireplumber-module-dbus-connection]' failed to
#                            load: Failed to connect to bus
#     -> support.system-dbus is the SYSTEM-bus connection (bus.system=true).
#        There is no system D-Bus in this container, and the only thing that
#        needs it is ModemManager (below) — session-bus support.dbus, used by
#        device reservation, is a separate component and is left enabled.
#
#   wp-internal-comp-loader  skipping component 'support.modem-manager [module:
#                            libwireplumber-module-modem-manager]' because some
#                            of its dependencies were not loaded
#     -> ModemManager call-audio integration; requires support.system-dbus. No
#        modems here (we route network audio), so it's skipped — disable it so
#        it isn't even attempted.
#
#   wp-internal-comp-loader  skipping component 'hooks.device.profile.find-
#                            voice-call [script/lua: device/find-voice-call-
#                            profile.lua]'
#     -> picks a device's profile during a phone call; requires
#        support.modem-manager. Nothing to do without a modem.
#
# Drop-in dictionary sections are merged over the defaults (see pipewire.conf(5)
# "DROP-IN CONFIGURATION FILES"), so setting these keys in `main` overrides the
# `required` the base profile declares for them.
wireplumber.profiles = {
  main = {
    hardware.video-capture = disabled
    hardware.bluetooth = disabled
    support.logind = disabled
    monitor.bluez.seat-monitoring = disabled
    script.client.access-snap = disabled
    support.system-dbus = disabled
    support.modem-manager = disabled
    hooks.device.profile.find-voice-call = disabled
  }
}
