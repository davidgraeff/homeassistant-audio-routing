# Static RAOP (AirPlay) sink definitions for known devices — Section 5.4a
# of PLAN.md. One block per configured receiver. Real bridge-daemon
# implementation will generate this file from the YAML device config
# instead of hand-editing it; this is the spike/manual version.
#
# raop.encryption.type = "auth_setup" is the default here, confirmed
# against real hardware (Pioneer VSX-934, Dusche/WX-021) — NOT "none" and
# NOT "RSA". Both of those get rejected with "403 Forbidden" on ANNOUNCE:
# these receivers require the Apple device-verification handshake
# ("POST /auth-setup" with a real Apple certificate exchange) before they
# accept a session, independent of whether the actual audio payload gets
# encrypted. See spikes/02-raop-static-sink.md for the full RTSP capture
# that pinned this down. If a future device rejects "auth_setup", fall
# back to trying "none" first, then "RSA".
context.modules = [
    { name = libpipewire-module-raop-sink
        args = {
            raop.ip = "192.0.2.1"
            raop.port = 5000
            raop.name = "spike-test-placeholder"
            raop.transport = "udp"
            raop.encryption.type = "auth_setup"
            audio.format = "S16"
            audio.rate = 44100
            audio.channels = 2
            node.name = "raop-spike-test-placeholder"
        }
        flags = [ nofail ]
    }
]
