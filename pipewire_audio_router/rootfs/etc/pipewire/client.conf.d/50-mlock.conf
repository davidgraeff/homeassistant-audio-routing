# Lock PipeWire's memory to stop audio stutter under host memory pressure —
# the client-context counterpart of pipewire.conf.d/50-mlock.conf.
#
# This one is the important one: the bridge daemon creates its own PipeWire
# client context (bridge-daemon/src/pw_thread.rs) and loads the raop-sink /
# sendspin nodes into it, so the latency-critical audio data-loop actually runs
# in the bridge-daemon process, which reads client.conf. Locking its pages into
# RAM keeps a memory-hungry job elsewhere on the Pi (OS update, compile) from
# paging out the audio path and causing an xrun. See the pipewire.conf.d
# sibling for the full rationale and the CAP_IPC_LOCK / config.yaml note.
context.properties = {
  mem.allow-mlock = true
  mem.mlock-all   = true
  mem.warn-mlock  = true
}
