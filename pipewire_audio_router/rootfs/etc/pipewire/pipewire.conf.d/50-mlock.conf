# Lock PipeWire's memory to stop audio stutter under host memory pressure.
#
# RT scheduling (see the Dockerfile's module-rt patch) stops CPU contention
# from starving the audio thread, but it does nothing about paging: if the
# kernel reclaims the audio pages while a memory-hungry job runs on the same Pi
# (an OS update, a big compile), the RT thread stalls on a major page fault ->
# an xrun. Locking the pages into RAM removes that failure mode.
#
# mem.allow-mlock (default true) locks just the shared audio-buffer pool.
# mem.mlock-all additionally mlockall()s the whole process (current + future
# pages) — the stronger guarantee wanted here, since the goal is "no stutter
# even while the box is thrashing". mem.warn-mlock makes a failed lock LOUD
# rather than a silent fall-through to pageable memory: if you see an mlock
# warning after deploying, CAP_IPC_LOCK isn't actually in effect (it's granted
# via config.yaml `privileged: [IPC_LOCK]`, which lets mlockall bypass the
# container's RLIMIT_MEMLOCK ceiling).
#
# These are `context.properties` (a dictionary), so unlike module-rt this can
# be a clean drop-in: dict sections merge and override the commented defaults
# in the base pipewire.conf (see pipewire.conf(5) "DROP-IN CONFIGURATION FILES").
#
# This file covers the `pipewire` daemon; the identical client.conf.d drop-in
# covers PipeWire clients, including the bridge daemon that hosts the sink nodes.
context.properties = {
  mem.allow-mlock = true
  mem.mlock-all   = true
  mem.warn-mlock  = true
}
