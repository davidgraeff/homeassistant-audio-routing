[package]
name = "pwrouter-agent"
version = "0.1.0"
edition = "2021"

# Its own workspace root, like bridge-daemon: the two crates are built and
# shipped separately (the agent runs on the *receiver* host, not in the add-on
# container), and keeping the roots separate stops one's vendored/excluded trees
# and lint config from leaking into the other.
[workspace]

[dependencies]
# The agent is a PipeWire *client*: it loads module-rtp-session into its own
# context (docs/receiver-agent.md §4) and reads/writes channelVolumes on the
# sink our receive stream feeds (§6). Same major as bridge-daemon so the shared
# `pw-control` crate (P1) can serve both.
pipewire = "0.10"
anyhow = "1"
# Volume pods, the cubic scale, and the module-load FFI, shared with the add-on's
# bridge-daemon (docs/receiver-agent.md §12). A path dep one directory *up*,
# so it never becomes a member of this crate's workspace.
pw-control = { path = "../pw-control" }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time", "sync", "signal"] }
tokio-tungstenite = "0.30.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
mdns-sd = "0.20.3"
# Status-tray icon and pairing notification (src/desktop.rs). `ksni` is a pure-Rust
# StatusNotifierItem implementation on zbus — no GTK, no libdbus, nothing to link —
# so the two-architecture cross-build in the add-on's Dockerfile and its GLIBC_2.34
# floor are unaffected. Both are optional at runtime: a headless host has neither a
# tray nor a notification server and keeps using the journal.
ksni = "0.3.6"
# For `org.freedesktop.Notifications` directly; same defaults as ksni's own zbus dep
# (no async-io) so the two resolve to one copy on one runtime.
zbus = { version = "5", default-features = false, features = ["tokio"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
futures-util = { version = "0.3.33", default-features = false, features = ["sink", "std"] }
