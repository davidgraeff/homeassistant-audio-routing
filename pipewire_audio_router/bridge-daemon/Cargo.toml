[package]
name = "bridge-daemon"
version = "0.3.20260728212654"
edition = "2021"

# This package is its own workspace root, and the `exclude` is load-bearing: a
# path dependency living *inside* the workspace directory automatically becomes a
# member, which put the vendored crates under `cargo fmt --all` and
# `cargo clippy --workspace`. They are third-party trees with their own style —
# reformatting them destroys the diff against upstream and buries our patches.
# `vendor/libairptp` needs no entry (C, no Cargo.toml), and neither does sendspin,
# which is a submodule above this directory and so can never join.
[workspace]
exclude = ["vendor/airplay2-sender", "vendor/shairplay"]

[dependencies]
pipewire = "0.10"
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
# Serve the built Svelte frontend (frontend/dist) as static files.
tower-http = { version = "0.7", features = ["fs"] }
# Pure-Rust decode for announce clips (decode.rs) — replaces an ffmpeg
# subprocess that pulled ~250-300MB of unrelated GPU/video-transcoding
# system dependencies into the runtime image for what was only ever
# "decode a short spoken-word clip." "all" enables every bundled codec/
# container (mp3, aac, ogg/vorbis, flac, wav, ...); the size cost is a bit
# more compiled Rust in our own ~8MB binary, not a system dependency
# tree, so there's no real reason to hand-pick a narrower feature set.
symphonia = { version = "0.6", features = ["all"] }
# Pure-Rust mDNS/DNS-SD for auto-discovering RAOP (AirPlay) receivers on the
# LAN (_raop._tcp) — no avahi/system daemon dependency, so it works the same
# in the add-on container as on a dev box (needs multicast reachability, i.e.
# host networking in the container).
mdns-sd = "0.20"
# SCHED_FIFO for the sendspin capture→wire relay thread (sendspin_server.rs), so
# it can't be starved by general-purpose async work — the primary sendspin
# stutter cause (RC1, docs/audio-jitter-analysis.md). Already in the build tree
# via the vendored crates.
libc = "0.2"
# Lock-free SPSC ring for the AirPlay ingest jitter buffer (airplay_source.rs):
# the RT process callback (now RT_PROCESS, on the graph data-loop) must pop
# without ever blocking on the decode thread — the old Mutex<VecDeque> could
# stall the graph cycle → airplay-in xruns → stutter on every output (RC1/RC2,
# confirmed live via pw-top). Real-time-audio-focused SPSC ring.
rtrb = "0.3"
# Embedded Sendspin server role (replaces the sendspin-adapter.py subprocess
# wrapping aiosendspin[server], removing ~212MB of av/numpy/pillow from the
# runtime image and the last continuous shellout, pw-record, from the audio
# path — see docs/decisions.md). Our own fork's server role, not yet merged
# upstream (only the client/receiver role exists there), carried as a git
# SUBMODULE at ../submodules/sendspin.
#
# A plain path dep, not a git dep plus a `[patch]` override to a local copy.
# That arrangement pinned the same crate twice — a `rev` here and the contents
# of the local copy — and the two silently disagreed, so the recorded `rev` said
# nothing about what was actually built. The superproject's submodule gitlink is
# now the single pin, and it is exact.
#
# It lives *above* bridge-daemon/ on purpose: rustfmt searches for config by
# walking up, so a checkout under this directory inherits our rustfmt.toml and
# `cargo fmt` silently reformats the whole third-party crate into our style,
# destroying the diff against upstream.
#
# Depends transitively on mdns-sd 0.20, unified with this crate's own mdns-sd
# 0.20 (used by discovery.rs for RAOP) — and re-exported by sendspin, so the two
# cannot drift apart silently.
sendspin = { path = "../submodules/sendspin" }

# Native AirPlay (RAOP) receiver — a pure-Rust, clean-room AP1+AP2 server that
# hands us decoded f32 PCM via a callback (spike-validated end-to-end). Replaces
# the shairport-sync subprocess, which had no PipeWire backend in the Ubuntu
# build so its audio never reached the graph. LGPL-3.0-or-later. Decodes ALAC/
# AAC via symphonia (already a dep) and advertises via mdns-sd (already a dep).
# Vendored (path) so we can instrument the RTSP handshake — see vendor/shairplay.
shairplay = { path = "vendor/shairplay" }

# Vendored AirPlay-2 SENDER (lmcgartland/airplay2-rs, GPL-2.0), patched: its own
# libairptp is stripped (the daemon owns the single host-global gPTP grandmaster
# in ap2_ptp.rs and injects the clock id via Connection::set_ptp_clock_id). Used
# by ap2_server.rs to stream captured PCM to AirPlay-2 receivers — the RAOP-output
# replacement. See vendor/airplay2-sender/Cargo.toml for what was dropped/patched.
airplay-client = { path = "vendor/airplay2-sender/crates/airplay-client" }
# Core types (Device/Features/StreamConfig/TimingProtocol/PtpMode) the sender's
# Connection needs but airplay-client doesn't re-export. Same vendored workspace.
airplay-core = { path = "vendor/airplay2-sender/crates/airplay-core" }
opusic-sys = "0.7.4"
flacenc = { version = "0.5.1", default-features = false, features = ["log"] }
futures-util = { version = "0.3.33", default-features = false, features = ["sink", "std"] }

# Compiles the vendored libairptp C (vendor/libairptp/) — OwnTone's MIT
# AirPlay-2 gPTP grandmaster — into the daemon for the AP2 sender's PTP.
[build-dependencies]
cc = "1"
