<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PipeWire Audio Router</title>
<style>
  :root { color-scheme: light dark; }
  body {
    font-family: system-ui, sans-serif;
    margin: 2rem;
    max-width: 900px;
  }
  h1 { font-size: 1.3rem; }
  #status { color: #888; font-size: 0.85rem; margin-bottom: 1rem; }
  table { border-collapse: collapse; width: 100%; }
  th, td { border: 1px solid #8884; padding: 0.4rem 0.6rem; text-align: center; }
  th.source-col { text-align: left; white-space: nowrap; }
  td.link-cell { cursor: pointer; font-size: 1.2rem; user-select: none; }
  td.link-cell:hover { background: #8882; }
  .volume-row input[type=range] { width: 100%; }
  .output-header { display: flex; flex-direction: column; gap: 0.25rem; align-items: center; }
  .empty { color: #888; font-style: italic; padding: 1rem 0; }
</style>
</head>
<body>
  <h1>PipeWire Audio Router — Manual Routing</h1>
  <div id="status">connecting…</div>
  <div id="matrix"></div>

  <script>
    const statusEl = document.getElementById('status');
    const matrixEl = document.getElementById('matrix');
    let matrix = { sources: [], outputs: [], links: [] };
    let volumes = {}; // node_id -> 0..1

    function isLinked(sourceId, outputId) {
      return matrix.links.some(([s, o]) => s === sourceId && o === outputId);
    }

    function render() {
      if (matrix.sources.length === 0 || matrix.outputs.length === 0) {
        matrixEl.innerHTML = '<p class="empty">' +
          (matrix.sources.length === 0 ? 'No sources currently playing. ' : '') +
          (matrix.outputs.length === 0 ? 'No outputs configured/available.' : '') +
          '</p>';
        return;
      }
      let html = '<table><thead><tr><th class="source-col">Source</th>';
      for (const o of matrix.outputs) {
        html += `<th><div class="output-header"><span>${escapeHtml(o.display_name)}</span>` +
          `<input type="range" min="0" max="1" step="0.01" value="${volumes[o.node_id] ?? 1}" ` +
          `data-node-id="${o.node_id}" class="volume-slider"></div></th>`;
      }
      html += '</tr></thead><tbody>';
      for (const s of matrix.sources) {
        html += `<tr><th class="source-col">${escapeHtml(s.display_name)}</th>`;
        for (const o of matrix.outputs) {
          const linked = isLinked(s.node_id, o.node_id);
          html += `<td class="link-cell" data-source-id="${s.node_id}" data-output-id="${o.node_id}" ` +
            `data-linked="${linked}">${linked ? '✓' : '—'}</td>`;
        }
        html += '</tr>';
      }
      html += '</tbody></table>';
      matrixEl.innerHTML = html;

      for (const cell of matrixEl.querySelectorAll('.link-cell')) {
        cell.addEventListener('click', onCellClick);
      }
      for (const slider of matrixEl.querySelectorAll('.volume-slider')) {
        slider.addEventListener('change', onVolumeChange);
      }
    }

    async function onCellClick(ev) {
      const cell = ev.currentTarget;
      const sourceId = parseInt(cell.dataset.sourceId, 10);
      const outputId = parseInt(cell.dataset.outputId, 10);
      const linked = cell.dataset.linked === 'true';
      cell.textContent = '…'; // pending, until the WS snapshot confirms the real state
      try {
        const resp = await fetch(`/api/routing/${linked ? 'unlink' : 'link'}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ source_node_id: sourceId, output_node_id: outputId }),
        });
        const body = await resp.json();
        if (!body.ok) console.error('routing change failed:', body.message);
      } catch (e) {
        console.error('routing request failed:', e);
      }
      // No optimistic flip here — the WebSocket's next snapshot (driven by
      // PipeWire's own registry event once the link actually appears/
      // disappears) is the source of truth and arrives within
      // milliseconds (spike 4: ~16ms per pw-link round trip).
    }

    async function onVolumeChange(ev) {
      const nodeId = ev.currentTarget.dataset.nodeId;
      const volume = parseFloat(ev.currentTarget.value);
      volumes[nodeId] = volume;
      try {
        await fetch(`/api/media_players/${nodeId}/volume`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ volume }),
        });
      } catch (e) {
        console.error('volume change failed:', e);
      }
    }

    function escapeHtml(s) {
      return s.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    async function refreshVolumes() {
      try {
        const resp = await fetch('/api/media_players');
        const players = await resp.json();
        for (const p of players) {
          if (typeof p.volume === 'number') volumes[p.node_id] = p.volume;
        }
        render();
      } catch (e) {
        console.error('volume refresh failed:', e);
      }
    }

    function connect() {
      const proto = location.protocol === 'https:' ? 'wss' : 'ws';
      const ws = new WebSocket(`${proto}://${location.host}/api/routing/ws`);
      ws.onopen = () => { statusEl.textContent = 'connected'; };
      ws.onmessage = (ev) => {
        matrix = JSON.parse(ev.data);
        render();
      };
      ws.onclose = () => {
        statusEl.textContent = 'disconnected — retrying…';
        setTimeout(connect, 2000);
      };
      ws.onerror = () => ws.close();
    }

    connect();
    refreshVolumes();
    setInterval(refreshVolumes, 3000);
  </script>
</body>
</html>
