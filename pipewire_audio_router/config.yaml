name: PipeWire Audio Router
version: "0.3.20260728212654"
slug: pipewire_audio_router
description: >-
  PipeWire-based whole-home audio router (AirPlay-2 + sendspin outputs) with
  cross-protocol groups and ducked announcements.
url: "https://github.com/davidgraeff/homeassistant-audio-routing"
# Prebuilt image, pushed to GHCR (release images by
# .github/workflows/build-addon.yml, dev images by scripts/deploy-dev.sh).
# Because this field is set, Supervisor treats the add-on as image-based
# (build: false) and PULLS this image rather than compiling the Rust bridge
# daemon on-device — true even for the local /addons/ dev install. Supervisor
# substitutes {arch} with the target's HA arch (aarch64/amd64/…).
image: "ghcr.io/davidgraeff/{arch}-addon-pipewire_audio_router"
arch:
  - amd64
  - aarch64
startup: application
boot: auto
# Required: PC-sourced RTP audio and the AirPlay-2 senders (RTP + gPTP on
# 319/320) need to receive/send unsolicited traffic on the LAN. Default bridge
# networking isolates the container from the host's other interfaces by design.
host_network: true
# Extra Linux capabilities for glitch-free audio under host load (an OS update
# or compile on the same Pi) — not full_access, just these two:
#   SYS_NICE: lets PipeWire's realtime module raise the audio data-loop to
#     SCHED_FIFO directly (no RTKit — see Dockerfile), so CPU contention can't
#     starve it.
#   IPC_LOCK: lets PipeWire mlockall() the audio path (mem.mlock-all, see the
#     pipewire.conf.d/client.conf.d drop-ins) bypassing the container's
#     RLIMIT_MEMLOCK ceiling, so memory pressure can't page it out mid-stream.
privileged:
  - SYS_NICE
  - IPC_LOCK
# Surface the daemon's web UI in HA's sidebar via ingress (authenticated,
# no separate login). The daemon serves the built Svelte UI at its listen
# port; ingress proxies to it. With host_network the add-on listens on the
# host, so ingress_port must match the daemon's port (8099 — not 8080, which
# commonly collides with other add-ons). The UI uses relative asset/API paths,
# so it works both here and opened directly at :8099. (Ingress + host_network
# can be finicky per Supervisor version — verify in the sidebar after install.)
ingress: true
ingress_port: 8099
panel_icon: mdi:speaker-multiple
panel_title: Audio Router
