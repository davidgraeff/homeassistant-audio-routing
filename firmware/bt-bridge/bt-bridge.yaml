esphome:
  name: bt-bridge
  friendly_name: Bluetooth Audio Bridge
  min_version: 2025.1.0

esp32:
  board: esp32dev
  framework:
    type: esp-idf
    advanced:
      # Remap SRAM1 as IRAM to free ~40 KB of DRAM heap (the bootloader logs
      # that it supports this). This build shares tight internal DRAM between
      # classic BT and WiFi; the extra headroom keeps Bluedroid's HCI RX pool
      # safe and lets the RTP TX ring (a2dp_bridge.cpp) be sized to absorb
      # BT/WiFi coexistence stalls. Only the app changes, so it applies over OTA.
      sram1_as_iram: true
    # NOTE: do NOT bump CONFIG_ESP_WIFI_DYNAMIC_TX_BUFFER_NUM here. An earlier
    # attempt (64, ~+50 KB heap) starved Bluedroid's HCI RX pool on this
    # BT-classic + WiFi build and crashed the BT controller task with an
    # assert in host_recv_pkt_cb (hci_hal_h4.c) on the next inbound ACL packet.
    # The firmware's own RTP TX task (a2dp_bridge.cpp, "Fix 3") already handles
    # a full WiFi TX buffer by retrying instead of dropping, which is what the
    # extra driver buffers were for — so the bump is both redundant and unsafe.

# Deliberately NOT included: esp32_ble, esp32_ble_tracker, bluetooth_proxy,
# esp32_improv_ble. Omitting all four is what keeps the classic-BT radio
# free for a2dp_bridge with no stack conflict — see PLAN.md Section 5.3.
# If any of them is ever added to this device, re-read that section first,
# it documents a real CONFIG_BT_CLASSIC_ENABLED=False landmine.

external_components:
  - source:
      type: local
      path: components

logger:

api:
  encryption:
      key: "tqKenRnTdf1bvc/gsb0v7zVKIUKcfaO6fdeiy4mp0tI="

ota:
  platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Real-time RTP audio egress + BT/WiFi radio coexistence cannot tolerate
  # the radio duty-cycling that ESPHome's ESP32 default (LIGHT) imposes:
  # it parks WiFi between DTIM beacons (~100ms) so UDP goes out in bursts,
  # underrunning the receiver's jitter buffer -> audible stutter. Keep the
  # radio always-on for this streaming box.
  power_save_mode: none

  ap:
    ssid: "BT Bridge Fallback Hotspot"
    password: !secret fallback_ap_password

captive_portal:

a2dp_bridge:
  id: bt_bridge
  device_name: "HA Audio Bridge"
  rtp_host: !secret pipewire_rtp_host
  rtp_port: 46000
  connected:
    name: "Bluetooth Connected"
  peer_name:
    name: "Bluetooth Device Name"
  peer_address:
    name: "Bluetooth Device Address"
  track_title:
    name: "Track Title"
  track_artist:
    name: "Track Artist"

# RTP target is HA-configurable at runtime (not just a compile-time
# secret) — e.g. to repoint this box at a different PipeWire host without
# reflashing. `restore_value: true` persists whatever HA last set across
# reboots; `initial_value` only matters for the very first boot before
# any value has been persisted.
text:
  - platform: template
    name: "PipeWire RTP Host"
    id: rtp_host_text
    mode: text
    optimistic: true
    restore_value: true
    initial_value: !secret pipewire_rtp_host
    set_action:
      - lambda: |-
          id(bt_bridge).set_rtp_host(x);

number:
  - platform: template
    name: "PipeWire RTP Port"
    id: rtp_port_number
    mode: box
    optimistic: true
    restore_value: true
    initial_value: 46000
    min_value: 1
    max_value: 65535
    step: 1
    set_action:
      - lambda: |-
          id(bt_bridge).set_rtp_port((uint16_t) x);
